services:

  postgresql:
    image: postgis/postgis:17-3.5-alpine
    container_name: java-document-server-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: java-document-server-redis
    restart: on-failure
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./storage/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: java-document-server-seaweedfs
    restart: on-failure
    entrypoint:
      - "sh"
      - "-c"
      - |
        mkdir -p /data /etc/seaweedfs
        cat <<EOF > /etc/seaweedfs/s3.json
        {
          "identities": [
            {
              "name": "app",
              "credentials": [
                {
                  "accessKey": "$${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}",
                  "secretKey": "$${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
                }
              ],
              "actions": ["Read", "Write", "List", "Tagging", "Admin"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./storage/filestore:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status >/dev/null 2>&1 || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: java-document-server-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint:
      - "sh"
      - "-c"
      - |
        aws --endpoint-url=http://seaweedfs:8333 s3 mb s3://${S3_BUCKET:-documents} || true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: java-document-server-backend
    restart: on-failure
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:${SERVER_PORT:-8080}/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: java-document-server-frontend
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: ${FRONTEND_PORT:-3000}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:${FRONTEND_PORT:-3000}/login || wget -qO- http://127.0.0.1:${FRONTEND_PORT:-3000}/" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
