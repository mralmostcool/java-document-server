spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:examportal}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  security:
    user:
      name: ${DEV_SECURITY_USER:admin}
      password: ${DEV_SECURITY_PASSWORD:admin}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

scalar:
  enabled: true
  url: "/v3/api-docs"
  theme: "deepSpace"
  layout: "modern"
  documentDownloadType: "both"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,mappings"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.orm.jpa: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

