spring:
  application:
    name: pdfserver

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  session:
    store-type: redis

  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: "mappings,health,info,scalar"
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

scalar:
  enabled: true
  url: "/v3/api-docs"
  theme: "deepSpace"
  layout: "modern"
  documentDownloadType: "both"
  actuatorEnabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true
