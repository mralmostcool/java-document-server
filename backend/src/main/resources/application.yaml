spring:
  application:
    name: pdfserver

  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  session:
    store-type: redis

  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    org:
      flywaydb: DEBUG
      hibernate:
        SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

scalar:
  enabled: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
